<div class="login-container">
  <div class="login-box">
    <h2>SnowDispatcher</h2>
    <p>Connexion</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom d'utilisateur:</label>
        <input 
          type="text" 
          class="form-control" 
          formControlName="username"
          [class.is-invalid]="submitted && f['username'].errors"
        />
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">Le nom d'utilisateur est requis</div>
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe:</label>
        <input 
          type="password" 
          class="form-control" 
          formControlName="password"
          [class.is-invalid]="submitted && f['password'].errors"
        />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Le mot de passe est requis</div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>

    <p class="hint">Utilisez les identifiants: admin / admin123</p>
  </div>
</div>
